server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: devfuel
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/devfuel}
    username: ${SPRING_DATASOURCE_USERNAME:devfuel}
    password: ${SPRING_DATASOURCE_PASSWORD:devfuel}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 4MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  parser:
    version: ${PARSER_VERSION:v1}
  temporal:
    zone: ${APP_TEMPORAL_ZONE:Asia/Kolkata}
  upload:
    dir: ${APP_UPLOAD_DIR:data/uploads}
    max-bytes: 4194304
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    vision-model: ${OPENAI_VISION_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    connect-timeout-ms: 5000
    read-timeout-ms: 60000

logging:
  level:
    root: INFO
    com.devfuel: INFO
